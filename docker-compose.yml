services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: autonova-sqlserver
    environment:
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: autonova-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - "YourStrong@Passw0rd"
      - -Q
      - "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'autonova') CREATE DATABASE autonova"
      - -C
    restart: "no"

volumes:
  sqlserver_data:
